
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080c09">
<title>ROXXY AI — Your Personal AI</title>

<style>
:root {
  --bg: #080c09;
  --panel: #101810;
  --card: #19251b;
  --green: #a5ff00;
  --text: #f5f7f3;
  --muted: #9ba99b;
  --border: #263a27;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
}

header {
  height: 68px;
  border-bottom: 1px solid #1b2b1d;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6%;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 1px;
}

.logo span,
h1 span {
  color: var(--green);
}

.status {
  color: var(--green);
  font-size: 11px;
  font-weight: bold;
}

main {
  width: min(850px, 94%);
  margin: 75px auto 40px;
}

.hero {
  text-align: center;
  margin-bottom: 35px;
}

h1 {
  font-size: clamp(35px, 6vw, 55px);
  margin: 0 0 15px;
}

.subtitle {
  color: var(--muted);
  font-size: 15px;
}

.chatbox {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 15px 55px rgba(0,0,0,.25);
}

.shortcuts {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-bottom: 22px;
}

.shortcuts button {
  background: #172319;
  border: 1px solid #304532;
  color: #e5eee3;
  padding: 10px 14px;
  border-radius: 9px;
  cursor: pointer;
}

.shortcuts button:hover {
  border-color: var(--green);
  color: var(--green);
}

#chat {
  height: 350px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 4px 0 15px;
  scroll-behavior: smooth;
}

.msg {
  max-width: 88%;
  padding: 14px;
  border-radius: 12px;
  line-height: 1.6;
  font-size: 14px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.bot {
  align-self: flex-start;
  background: var(--card);
  border: 1px solid #263b28;
}

.user {
  align-self: flex-end;
  background: var(--green);
  color: #101500;
}

.inputrow {
  display: flex;
  gap: 9px;
  margin-top: 12px;
}

input {
  flex: 1;
  min-width: 0;
  background: #080d09;
  color: white;
  border: 1px solid var(--green);
  border-radius: 10px;
  padding: 15px;
  outline: none;
  font-size: 15px;
}

input:focus {
  box-shadow: 0 0 0 2px rgba(165,255,0,.15);
}

.send {
  background: var(--green);
  border: none;
  border-radius: 10px;
  padding: 0 22px;
  font-weight: 900;
  cursor: pointer;
}

.send:disabled {
  opacity: .5;
  cursor: wait;
}

.note {
  font-size: 11px;
  color: #829082;
  margin-top: 15px;
}

footer {
  text-align: center;
  color: #667266;
  font-size: 12px;
  padding: 30px 10px;
}

@media(max-width:600px) {
  main {
    margin-top: 45px;
  }

  .chatbox {
    padding: 13px;
  }

  #chat {
    height: 55vh;
  }

  .inputrow {
    gap: 6px;
  }

  .send {
    padding: 0 15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">ROXXY <span>AI</span></div>
  <div class="status">● YOUR AI WORKSPACE</div>
</header>

<main>

  <section class="hero">
    <h1>Meet <span>ROXXY AI</span></h1>
    <div class="subtitle">
      Your personal AI workspace for ideas, business and creativity.
    </div>
  </section>

  <section class="chatbox">

    <div class="shortcuts">
      <button onclick="quick('Help me create an Instagram marketing plan.')">Marketing</button>
      <button onclick="quick('Help me plan and grow my business.')">Business</button>
      <button onclick="quick('Give me creative and innovative ideas.')">Ideas</button>
      <button onclick="quick('Help me answer a customer enquiry professionally.')">Customer support</button>
    </div>

    <div id="chat" aria-live="polite">
      <div class="msg bot">
        Hello! I'm ROXXY AI. 👋

        I'm your personal AI assistant. What would you like to work on today?
      </div>
    </div>

    <form class="inputrow" id="chatForm">
      <input
        id="question"
        type="text"
        placeholder="Ask ROXXY AI anything..."
        autocomplete="off"
        maxlength="10000"
        required
      >
      <button class="send" id="sendButton" type="submit">SEND</button>
    </form>

    <p class="note">
      ROXXY AI • Powered by Gemini • Built by ROXXY
    </p>

  </section>
</main>

<footer>
  © 2026 ROXXY AI · BUILT BY ROXXY
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("question");
const sendButton = document.getElementById("sendButton");
const chatForm = document.getElementById("chatForm");

function addMessage(text, type) {
  const message = document.createElement("div");
  message.className = "msg " + type;
  message.textContent = text;
  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
  return message;
}

function quick(text) {
  input.value = text;
  input.focus();
  sendMessage();
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text || sendButton.disabled) return;

  addMessage(text, "user");
  input.value = "";

  sendButton.disabled = true;
  sendButton.textContent = "...";

  const loading = addMessage("ROXXY AI is thinking...", "bot");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI request failed.");
    }

    loading.textContent = data.reply || "Please try again.";

  } catch (error) {
    loading.textContent = "Sorry! " + error.message;
  } finally {
    sendButton.disabled = false;
    sendButton.textContent = "SEND";
    input.focus();
  }
}

chatForm.addEventListener("submit", function(event) {
  event.preventDefault();
  sendMessage();
});
</script>

</body>
</html>
